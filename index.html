
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T Edit Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100b1c;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#211331;font-size:25px;font-weight:bold}
header span{color:#ff9138}
main{padding:18px;max-width:700px;margin:auto}
h2{font-size:24px}
button{border:0;border-radius:14px;padding:16px;background:#ff9138;color:#211331;font-size:17px;font-weight:bold;width:100%;margin:8px 0}
.preview{background:#050408;border:1px solid #49345c;border-radius:22px;padding:12px;min-height:240px;display:flex;align-items:center;justify-content:center;position:relative}
video{width:100%;max-height:55vh;display:block}
.watermark{position:absolute;bottom:22px;right:20px;background:#211331dd;color:#ff9138;padding:8px;border-radius:8px;font-weight:bold;pointer-events:none}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button{background:#332344;color:white}
input{width:100%;padding:12px;margin:8px 0;font-size:16px}
.note{color:#c5b5d5;line-height:1.5}
#editor{display:none}
</style>
</head>
<body>
<header>▶ T Edit <span>Studio</span></header>
<main>
<section id="home">
  <h2>Your Story. Your Style.</h2>
  <p class="note">Choose a video and start creating.</p>
  <button onclick="openPicker()">＋ Start Editing</button>
  <button onclick="openPicker()">🎬 Video</button>
  <input id="file" type="file" accept="video/*" hidden>
</section>

<section id="editor">
  <h2>Your Video</h2>
  <div class="preview">
    <video id="video" controls playsinline></video>
    <div class="watermark" id="logo">T Edit Studio</div>
  </div>

  <button onclick="openPicker()">＋ Change Video</button>

  <h2>Trim Preview</h2>
  <label>Start time (seconds)</label>
  <input id="start" type="number" min="0" value="0">
  <label>End time (seconds)</label>
  <input id="end" type="number" min="1" value="10">
  <button onclick="previewTrim()">Preview Selected Range</button>

  <div class="tools">
    <button onclick="video.play()">▶ Play</button>
    <button onclick="video.pause()">⏸ Pause</button>
    <button onclick="restartVideo()">↻ Restart</button>
    <button onclick="toggleMute()">🔊 Mute / Unmute</button>
    <button onclick="toggleLogo()">Show / Hide Logo</button>
  </div>
  <p class="note" id="status">Video ready to preview.</p>
  <button onclick="video.pause();alert('Export feature abhi banana baaki hai. Video abhi save nahi hota.')">Save / Export</button>
</section>
</main>

<script>
const fileInput=document.getElementById('file');
const video=document.getElementById('video');
const home=document.getElementById('home');
const editor=document.getElementById('editor');
const statusText=document.getElementById('status');
let videoUrl='';

function openPicker(){fileInput.click();}

fileInput.addEventListener('change',function(){
  const file=this.files && this.files[0];
  if(!file)return;
  if(!file.type.startsWith('video/')){
    alert('Please select a video file.');
    return;
  }
  if(videoUrl)URL.revokeObjectURL(videoUrl);
  videoUrl=URL.createObjectURL(file);
  video.src=videoUrl;
  home.style.display='none';
  editor.style.display='block';
  video.load();
  video.onloadedmetadata=function(){
    document.getElementById('start').max=Math.floor(video.duration);
    document.getElementById('end').max=Math.floor(video.duration);
    document.getElementById('end').value=Math.floor(video.duration);
    statusText.textContent='Video loaded: '+file.name;
  };
});

function previewTrim(){
  const s=Number(document.getElementById('start').value);
  const e=Number(document.getElementById('end').value);
  if(!video.src){alert('Pehle video select karo.');return;}
  if(s<0||e<=s||e>video.duration){
    alert('Start aur end time sahi bharo.');
    return;
  }
  video.currentTime=s;
  video.play();
  video.ontimeupdate=function(){
    if(video.currentTime>=e){
      video.pause();
      video.ontimeupdate=null;
    }
  };
  statusText.textContent='Selected range ka preview chal raha hai.';
}

function restartVideo(){video.currentTime=0;video.play();}
function toggleMute(){video.muted=!video.muted;}
function toggleLogo(){
  const logo=document.getElementById('logo');
  logo.style.display=logo.style.display==='none'?'block':'none';
}
</script>
</body>
</html>
